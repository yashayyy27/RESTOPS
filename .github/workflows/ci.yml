name: RESTOPS validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - name: Formatting and compilation
        run: |
          python -m black --check --workers 1 src tests streamlit_app.py
          python -m compileall -q src tests streamlit_app.py
      - name: Test portable demo workflows and decision logic
        run: |
          python -m unittest discover -s tests -p test_management.py -v
          python -m unittest discover -s tests -p test_planning.py -v
          python -m unittest discover -s tests -p test_app.py -v
      - name: Reproduce full synthetic pipeline
        run: python -m src.run_pipeline --regenerate --skip-notebooks
      - name: Full integrity, reconciliation, model and application tests
        run: python -m unittest discover -s tests -v
